server:
  port: 8081

spring:
  application:
    name: auth-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    # Default: embedded H2 database stored in ./data (nothing to install).
    # For PostgreSQL set DB_URL=jdbc:postgresql://localhost:5432/authdb, DB_USER and DB_PASSWORD.
    url: ${DB_URL:jdbc:h2:file:./data/authdb}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update   # dev only: creates/updates tables automatically
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

jwt:
  # Must be the SAME value in every service (auth, patient, consultation, results, ai): at least 32 characters.
  secret: ${JWT_SECRET:change-this-secret-in-production-0123456789}
  expiration-minutes: 480

# Shared secret for service-to-service calls that are not made on behalf of a user (never routed by the gateway)
internal:
  api-key: ${INTERNAL_API_KEY:change-this-internal-key-in-production}

app:
  # Base URL of the Angular app, used to build the patients' activation links
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
