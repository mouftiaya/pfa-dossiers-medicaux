server:
  port: 8085

spring:
  application:
    name: ai-service
  datasource:
    # Default: embedded H2 database stored in ./data (nothing to install).
    # For PostgreSQL set DB_URL=jdbc:postgresql://localhost:5432/aidb, DB_USER and DB_PASSWORD.
    url: ${DB_URL:jdbc:h2:file:./data/aidb}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update   # dev only: creates/updates tables automatically
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

jwt:
  # Must be the SAME value as in auth-service (at least 32 characters).
  secret: ${JWT_SECRET:change-this-secret-in-production-0123456789}
