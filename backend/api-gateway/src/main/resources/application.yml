server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # lb://<name> = look the service up in Eureka and load-balance
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: patient-service
          uri: lb://patient-service
          predicates:
            - Path=/api/patients/**
        # Next services go here, e.g.:
        # - id: consultation-service
        #   uri: lb://consultation-service
        #   predicates:
        #     - Path=/api/consultations/**
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
